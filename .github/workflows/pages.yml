name: Test and publish GitHub Pages

# Optional workflow. The test site currently uses the /docs branch source.
# Switch the Pages build type back to workflow before running this deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weekly-finances-quiz
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Test quiz, CAPTCHA and payment validation
        run: npm test
      - name: Verify compiled Cloudflare Worker
        run: npm run test:worker
      - name: Build static preview
        run: npm run build:pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the static preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: weekly-finances-quiz/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
